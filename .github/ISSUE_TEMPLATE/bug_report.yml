name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes: { label: Description, description: What happened and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction, description: Include sanitized configuration and steps. }
    validations: { required: true }
  - type: checkboxes
    id: secrets
    attributes:
      label: Safety check
      options:
        - label: I removed credentials and sensitive data.
          required: true
